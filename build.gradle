plugins {
    id 'java'
    id 'application'
}

group = 'com.zapei2'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    flatDir {
        dirs 'lib'
    }
    mavenCentral()
}

dependencies {
    implementation name: 'sqlite-jdbc-3.45.3.0'
    implementation name: 'flatlaf-3.4.1'
    implementation name: 'flatlaf-intellij-themes-3.4.1'
    implementation fileTree(dir: '/usr/lib', include: 'slf4j-api-2.0.16.jar')
    implementation fileTree(dir: '/usr/lib', include: 'slf4j-simple-2.0.16.jar')
}

application {
    mainClass = 'opencode.manager.Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'opencode.manager.Main'
        )
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('packageLinux', Exec) {
    dependsOn jar
    doFirst { mkdir 'dist' }
    commandLine 'jpackage',
        '--input', layout.buildDirectory.dir('libs').get().asFile.path,
        '--name', 'OpenCodeManager',
        '--main-jar', "${rootProject.name}-${version}.jar",
        '--main-class', 'opencode.manager.Main',
        '--type', 'deb',
        '--app-version', version,
        '--vendor', 'Zapei2',
        '--description', 'OpenCode Session Manager',
        '--linux-shortcut',
        '--dest', 'dist'
}
