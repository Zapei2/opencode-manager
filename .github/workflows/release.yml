name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build fat JAR
        run: |
          mvn clean package -DskipTests || gradle clean jar
      - name: Build Linux tar.gz
        run: |
          JAR=$(ls build/libs/*.jar target/*.jar 2>/dev/null | head -1)
          jpackage \
            --input "$(dirname "$JAR")" \
            --name "OpenCodeManager" \
            --main-jar "$(basename "$JAR")" \
            --main-class opencode.manager.Main \
            --type app-image \
            --app-version "${GITHUB_REF_NAME#v}" \
            --vendor "Zapei2" \
            --dest dist
          tar -czf "OpenCodeManager-${GITHUB_REF_NAME#v}-linux.tar.gz" -C dist OpenCodeManager/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: OpenCodeManager-*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build fat JAR
        run: |
          mvn clean package -DskipTests
        shell: bash
      - name: Build Windows .exe
        run: |
          jpackage `
            --input target `
            --name "OpenCodeManager" `
            --main-jar "opencode-manager-1.0.0.jar" `
            --main-class opencode.manager.Main `
            --type exe `
            --app-version "$env:GITHUB_REF_NAME.Replace('v','')" `
            --vendor "Zapei2" `
            --win-shortcut `
            --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-package/*.tar.gz
            windows-package/*.exe
          generate_release_notes: true
